name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/UnlimCloud-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/UnlimCloud-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: UnlimCloud-apk
          path: dist/*.apk

      - name: Publish GitHub Release (শুধু v* ট্যাগে)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
