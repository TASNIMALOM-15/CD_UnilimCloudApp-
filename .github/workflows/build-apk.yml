name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # TDLib নতুন করে build করাতে চাইলে এই সংখ্যাটা বাড়ান (যেমন "2")
  TDLIB_CACHE_VERSION: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ---------------------------------------------------------------
      # ধাপ ১: Telegram-এর অফিসিয়াল TDLib সোর্স থেকে Android লাইব্রেরি build
      # (প্রথমবার ৪০–৯০ মিনিট লাগতে পারে; পরের বার cache থেকে কয়েক সেকেন্ডে হয়ে যায়)
      # ---------------------------------------------------------------
      - name: Restore TDLib cache
        id: tdcache
        uses: actions/cache/restore@v4
        with:
          path: tdlib-prebuilt
          key: tdlib-android-${{ env.TDLIB_CACHE_VERSION }}

      - name: Build TDLib (official Dockerfile)
        if: steps.tdcache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/tdlib/td.git /tmp/td
          cd /tmp/td/example/android
          docker build --output /tmp/tdout .

          OUT=/tmp/tdout
          find "$OUT" -maxdepth 3 | head -50

          # Java সোর্স না পেলে tdlib.zip থেকে খুলে নেওয়া
          if ! find "$OUT" -name TdApi.java | grep -q .; then
            ZIP=$(find "$OUT" -name tdlib.zip | head -1)
            mkdir -p "$OUT/unz" && unzip -q "$ZIP" -d "$OUT/unz"
          fi

          DEST="$GITHUB_WORKSPACE/tdlib-prebuilt"
          mkdir -p "$DEST/java/org/drinkless/tdlib"
          cp "$(find "$OUT" -name TdApi.java | head -1)"  "$DEST/java/org/drinkless/tdlib/"
          cp "$(find "$OUT" -name Client.java | head -1)" "$DEST/java/org/drinkless/tdlib/"

          for ABI in arm64-v8a armeabi-v7a; do
            D=$(find "$OUT" -type d -path "*libs/$ABI" | head -1)
            mkdir -p "$DEST/jniLibs/$ABI"
            cp "$D"/*.so "$DEST/jniLibs/$ABI/"
          done
          test -f "$DEST/jniLibs/arm64-v8a/libtdjni.so"
          ls -lR "$DEST" | head -40

      # পরের ধাপ ব্যর্থ হলেও যাতে ৮০ মিনিটের TDLib build হারিয়ে না যায়
      - name: Save TDLib cache
        if: steps.tdcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tdlib-prebuilt
          key: tdlib-android-${{ env.TDLIB_CACHE_VERSION }}

      - name: Install TDLib into app
        run: |
          set -eux
          mkdir -p app/src/main/jniLibs app/src/main/java
          cp -r tdlib-prebuilt/jniLibs/* app/src/main/jniLibs/
          cp -r tdlib-prebuilt/java/* app/src/main/java/

      # ---------------------------------------------------------------
      # ধাপ ২: অ্যাপ build
      # ---------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "স্থায়ী release key ব্যবহার হবে"
          else
            echo "::warning::KEYSTORE_BASE64 secret সেট করা নেই; debug key ব্যবহার হচ্ছে (আপডেট ইনস্টল হবে না, আনইনস্টল করতে হবে)"
          fi

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "SHA-256|Signer #1 certificate DN" || true

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/UnlimCloud-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/UnlimCloud-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: UnlimCloud-apk
          path: dist/*.apk

      - name: Publish GitHub Release (শুধু v* ট্যাগে)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
